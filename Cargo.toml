[workspace]
members = ["actors","harnesses/*", "shared_types"]
resolver   = "3"

[workspace.dependencies]
eyre   = "0.6.14"
tokio = {version = "1.53.1", features = ["full"]}
serde_json = "1.0.151"
serde  = {version = "1.0.229", features = ["derive"]}
clap = {version  = "4.6.7", features = ["derive"]}
dotenvy   = "0.15.7"
async-openai = {version   = "0.42.1", features = ["full"]}
futures   = "0.3.34"
colored = "3.1.1"

[workspace.lints.clippy]
unwrap_used   = "warn"
