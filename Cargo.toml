[workspace]
members = ["tui_harnesses/simple_chat"]
resolver   = "3"

[workspace.dependencies]
eyre   = "0.6.14"
anathema = "0.2.11"
tokio = {version = "1.53.1", features = ["full"]}
serde_json = "1.0.151"
serde  = {version = "1.0.229", features = ["derive"]}

[workspace.lints.clippy]
unwrap_used   = "warn"
